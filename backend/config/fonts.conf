<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  fontconfig для 3D-типографики (lib/typography3d.ts).

  Railway собирает через RAILPACK, не Docker, поэтому системные шрифты
  доустановить нельзя — вместо этого шрифт вендорится в репозиторий, а
  fontconfig получает на него указатель.

  Включается переменной окружения:  FONTCONFIG_PATH=/app/backend/config
  Локально не нужен — системные шрифты находятся сами.

  Что положить в assets/fonts — см. assets/fonts/README.md
-->
<fontconfig>
  <!-- Вендоренные шрифты. Путь относительный: fontconfig считает его от
       каталога этого файла, поэтому конфиг переносим вместе с репозиторием. -->
  <dir prefix="relative">../assets/fonts</dir>

  <!-- Системные каталоги оставляем: на машине разработчика шрифты берутся
       оттуда, и локальный рендер совпадает с продовым по механике. -->
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir prefix="xdg">fonts</dir>

  <cachedir prefix="xdg">fontconfig</cachedir>
  <cachedir>/tmp/fontconfig</cachedir>

  <!-- sans-serif обязан вести на вендоренный шрифт: без этого fontconfig на
       пустом контейнере отдаст «ничего», и текст отрисуется пустотой. -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Design Power Display</family></prefer>
  </alias>

  <config></config>
</fontconfig>
